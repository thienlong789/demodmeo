<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Phụ Tùng Máy Xúc Lật</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- HEADER -->
<header>
  <h1>PHỤ TÙNG MÁY XÚC LẬT</h1>
  <p>Hàng sẵn kho – Giá tốt – Giao nhanh toàn quốc</p>
</header>

<!-- HERO -->
<section class="hero">
  <h2>Bơm – Lọc – Xi lanh – Động cơ</h2>
  <p>Chuyên phụ tùng máy xúc lật T916, T930, T936...</p>
  <button onclick="contact()">Nhắn Zalo nhận báo giá</button>
</section>

<!-- PRODUCT LIST -->
<section class="products" id="product-list"></section>

<!-- FORM -->
<section class="form">
  <h2>Nhận báo giá nhanh</h2>
  <input type="text" id="name" placeholder="Tên của bạn">
  <input type="text" id="phone" placeholder="Số điện thoại">
  <button onclick="submitForm()">Gửi thông tin</button>
</section>

<!-- FOOTER -->
<footer>
  <p>© 2026 Máy Công Trình</p>
</footer>

<script src="script.js"></script>
</body>
</html>
